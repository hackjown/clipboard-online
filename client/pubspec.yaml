  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  app_links: ^6.3.2
  share_plus: ^10.1.2
  desktop_drop: ^0.8.4
  path_provider: ^2.1.5
  cross_file: ^0.3.4
  mime: ^2.0.0
  receive_sharing_intent: ^1.9.0
  flutter_local_notifications: ^22.3.1
  video_player: ^2.14.1

dev_dependencies:
