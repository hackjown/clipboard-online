name: clipboard_client
description: 剪贴板 / Clipboard Online — macOS / iOS / Android 客户端
publish_to: 'none'
version: 0.1.6+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  path: ^1.9.0
