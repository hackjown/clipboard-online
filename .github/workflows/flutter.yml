name: Flutter client

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'client/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  macos:
    needs: analyze
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - name: Pack macOS app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent clipboard_client.app "$GITHUB_WORKSPACE/clipboard-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: clipboard-macos.zip

  ios-unsigned:
    needs: analyze
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa"
                    echo "--- IPA contents (PlugIns) ---"
          unzip -l "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa" | grep -E "PlugIns/.*\.appex/(Info.plist|ShareExtension)$" || true
          unzip -l "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa" | grep -q "Payload/Runner.app/PlugIns/ShareExtension.appex/" \
            && echo "OK: Share Extension (.appex) is embedded" \
            || { echo "ERROR: Share Extension missing from IPA"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: clipboard-ios-unsigned.ipa
      - name: ldid fake-sign for TrollStore (explicit entitlements)
        run: |
          brew install ldid
          ENT_DIR="$RUNNER_TEMP/ent"
          mkdir -p "$ENT_DIR"
          GROUP="group.com.clipboard.online.clipboardClient"
          for n in runner ext; do
            cat > "$ENT_DIR/$n.ent" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>$GROUP</string>
            </array>
          </dict>
          </plist>
          EOF
          done
          rm -rf ts && mkdir -p ts/Payload
          cp -R build/ios/iphoneos/Runner.app ts/Payload/
          APP=ts/Payload/Runner.app
          # 先签嵌入的 framework / 扩展，最后签主 App
          if [ -d "$APP/Frameworks" ]; then
            for f in "$APP"/Frameworks/*.framework; do ldid -S "$f"; done
          fi
          for x in "$APP"/PlugIns/*.appex; do ldid -S"$ENT_DIR/ext.ent" "$x"; done
          ldid -S"$ENT_DIR/runner.ent" "$APP"
          echo "=== entitlements: Runner.app ==="
          ldid -e "$APP" | tee "$RUNNER_TEMP/runner-ent.txt"
          grep -q "$GROUP" "$RUNNER_TEMP/runner-ent.txt" || { echo "ERROR: Runner.app missing app group entitlement"; exit 1; }
          for x in "$APP"/PlugIns/*.appex; do
            echo "=== entitlements: $x ==="
            ldid -e "$x" | tee "$RUNNER_TEMP/ext-ent.txt"
            grep -q "$GROUP" "$RUNNER_TEMP/ext-ent.txt" || { echo "ERROR: $x missing app group entitlement"; exit 1; }
          done
          (cd ts && zip -qry "$GITHUB_WORKSPACE/clipboard-ios-trollstore.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/clipboard-ios-trollstore.ipa"
          unzip -l "$GITHUB_WORKSPACE/clipboard-ios-trollstore.ipa" | grep -q "Payload/Runner.app/PlugIns/ShareExtension.appex/" \
            && echo "OK: TrollStore IPA embeds Share Extension" \
            || { echo "ERROR: Share Extension missing from TrollStore IPA"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ios-trollstore
          path: clipboard-ios-trollstore.ipa
    # 正式签名 IPA 需要 secrets：APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
    # APPLE_PROVISIONING_PROFILE, APPLE_TEAM_ID。本流水线只产出未签名制品。

  android-apk:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/clipboard-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: clipboard-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, ios-unsigned, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 下载说明
            - **clipboard-android.apk** — Android 安装包（debug 签名，可直接侧载）
            - **clipboard-macos.zip** — macOS `.app`，**未签名/未公证**：右键「打开」，或 `xattr -cr clipboard_client.app`
            - **clipboard-ios-trollstore.ipa** — **TrollStore 专用**：已用 ldid 伪签并写入 App Group entitlement（主 App 与分享扩展均有），分享扩展可用
            - **clipboard-ios-unsigned.ipa** — iOS **未签名** IPA，**不能直接安装**；供 AltStore / Sideloadly 或自有证书重签（免费 Apple ID 无 App Group，分享扩展会在面板里登录后直传）。IPA 内已嵌入 Share Extension（PlugIns/ShareExtension.appex）
            - 服务端镜像：`ghcr.io/hackjown/clipboard-online/clipboard-online`
          files: |
            dist/clipboard-macos.zip
            dist/clipboard-ios-unsigned.ipa
            dist/clipboard-ios-trollstore.ipa
            dist/clipboard-android.apk
