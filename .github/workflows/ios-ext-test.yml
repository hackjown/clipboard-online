name: iOS ext test (temp)
on:
  push:
    branches: [ios-share-ext]
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign -v 2>&1 | tail -n 400
        shell: bash
      - name: Package unsigned IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa" | grep -E "appex" | head -20
          unzip -l "$GITHUB_WORKSPACE/clipboard-ios-unsigned.ipa" | grep -q "PlugIns/ShareExtension.appex/" && echo "OK appex embedded"
